# Engram on one Docker host. The image tag comes from the release env written by deploy/pull-update.sh (one tag per
# commit). Instance config lives outside the repo in ${ENGRAM_CONFIG_DIR:-/etc/engram}: hosts.env (public, both
# containers) and engram.env (secrets, app only). See .env.example.
name: engram
services:
  app:
    image: engram-app:${ENGRAM_TAG:-1}
    container_name: engram-app
    restart: unless-stopped
    user: "1600:1600"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 768m
    pids_limit: 256
    ports:
      - "172.17.0.1:8340:8340"
    volumes:
      # Vault (markdown + git), SQLite index, master key. Only this directory is writable.
      - /srv/engram:/srv/engram
    # engram.env is root-only on the host: ntfy publish token, vault remote, provider keys.
    env_file: ["${ENGRAM_CONFIG_DIR:-/etc/engram}/hosts.env", "${ENGRAM_CONFIG_DIR:-/etc/engram}/engram.env"]
    environment:
      HOME: /srv/engram/home
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # The artifacts host: published files only. Sees just the vault's artifacts folder and the manifest + view key that
  # engram-app writes, both read-only; no database, master key, vault index or env secrets.
  artifacts:
    image: engram-app:${ENGRAM_TAG:-1}
    container_name: engram-artifacts
    restart: unless-stopped
    user: "1600:1600"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    command: ["node", "dist/src/artifacts/server.js"]
    mem_limit: 256m
    pids_limit: 64
    ports:
      - "172.17.0.1:8345:8345"
    volumes:
      - /srv/engram/vault/artifacts:/srv/engram/vault/artifacts:ro
      - /srv/engram/artifacts-serve:/srv/engram/artifacts-serve:ro
    env_file: ["${ENGRAM_CONFIG_DIR:-/etc/engram}/hosts.env"]
    environment:
      ARTIFACTS_PORT: "8345"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8345/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
